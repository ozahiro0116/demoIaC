# 任意: アプリのソースを repo に置く場合のアプリ専用 CD。
# （インフラ CD = bicep-cd.yml とは別。アプリを更新したいとき用。）
# デモのインシデント・ループ自体はインフラ(Bicep)のみで完結するため、本ワークフローは任意。
#
# 配置先: .github/workflows/app-cd.yml
name: App CD — Deploy sample app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sre-agent-demo/app/**'

permissions:
  id-token: write
  contents: read

env:
  WEBAPP_NAME: app-web-sql-dev-eus2
  APP_DIR: sre-agent-demo/app

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish ${{ env.APP_DIR }} -c Release -o ${{ runner.temp }}/publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: ${{ runner.temp }}/publish
